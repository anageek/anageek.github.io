services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    volumes:
      - sqlite-data:/app/data
      - upload-data:/app/public/images/uploads
    restart: unless-stopped

volumes:
  sqlite-data:
  upload-data:
