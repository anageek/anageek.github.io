        - generic [ref=e68]:
          - generic [ref=e69]:
            - heading "Summary" [level=3] [ref=e70]
            - paragraph [ref=e71]: The research was an exploration into player preferences within the survival game genre. This process included personal gameplay experiences and engaging directly with streamers and their audiences, which provided insights into mechanics, user interfaces, and overall player enjoyment factors.
            - heading "Target Audience" [level=3] [ref=e72]
            - paragraph [ref=e73]: The research for Naufrago identified a target audience of players who enjoy stylized, vibrant survival games with a touch of whimsy. This audience appreciates bright colors, engaging narratives, and unique interactions. By studying player behavior in similar games and gathering feedback through streaming platforms like Twitch.
            - heading "Benchmark" [level=3] [ref=e74]
            - paragraph [ref=e75]: To find inspiration for this game, I benchmarked against successful titles such as Raft, The Sims 2 Castaway, The Forest, Astroneer, and Subnautica. The objective was to analyze gameplay mechanics, UI/UX design, and player interaction patterns. My criteria included aesthetics, user experience, and customization options. These games excel in areas like multiplayer capabilities and high-quality graphics, but they often fall short in customization and offering a diverse range of enemies and challenges. By understanding the strengths and weaknesses of these titles, I aim to create a game that offers a well-rounded and engaging player experience.
          - img "Naufrago - Section 2" [ref=e77]
